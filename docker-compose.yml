# SparkVault: compose template. Copy it next to the code folder, edit the copy once, and run that copy.
#
#   /srv/sparkvault/app/                   the code (git clone, or scripts/sync-app.sh); replaced on every update
#   /srv/sparkvault/docker-compose.yaml    your edited copy of THIS file; updates never touch it
#   /srv/sparkvault/sparkvault.env         secrets (scripts/init-env.sh, or copy sparkvault.env.example)
#
# Edit the lines marked EDIT. Paths are written inline on purpose: they work the same from the CLI and from
# UIs (UGOS and similar) that do not read a .env next to the file for ${VAR} substitution. Use absolute
# paths for `context:` and `env_file:` in your copy. The secrets are not in this file.
# Start: docker compose up -d --build   (or select your copy in your NAS's Docker/Project UI).
# After a code update, rebuild; a plain restart reuses the old image.
#
# The app is plain HTTP and meant for a trusted network. Put it behind a TLS reverse proxy before
# exposing it further, and then set SPARKVAULT_COOKIE_SECURE=1 in sparkvault.env.
name: sparkvault
services:
  sparkvault:
    build:
      context: .                      # EDIT in your copy: the absolute path of the code folder (app/ above)
    image: sparkvault:local
    container_name: sparkvault
    restart: unless-stopped
    # EDIT: run as the owner and group of your folders so the app can read the catalogue and the
    # Hugging Face cache and write the inbox. Check the real owner with `ls -ldn <folder>` ON THE SERVER:
    # a share exported over NFS can look open while the underlying filesystem is not.
    user: "1000:1000"
    env_file: sparkvault.env          # EDIT with an absolute path if your UI runs the file from another folder
    environment:
      SPARKVAULT_CATALOGUE_DIR: /catalogue
      SPARKVAULT_HF_DIR: /hf
      SPARKVAULT_INBOX_DIR: /inbox
    ports:
      - "8080:8080"                   # EDIT the LEFT number if 8080 is taken
    volumes:
      - /srv/sparkvault/catalogue:/catalogue:ro   # EDIT: folder holding library.yaml and results/
      - /srv/models/huggingface:/hf:ro            # EDIT: Hugging Face cache root (the folder containing hub/)
      - /srv/sparkvault/inbox:/inbox              # EDIT: writable; only used when upload is on
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
