---
# Copy to inventory.yml (git-ignored) and put your own addresses in it. Host names are yours to choose.
#
# vllm_nodes  every host the playbooks manage (single-node playbooks target this group).
# vllm_head / vllm_worker  only for vllm_cluster.yml (two-node tensor parallel): exactly one host in
#             each. The head runs Ray and serves the API. Leave them out if you do not use the cluster.
all:
  children:
    vllm_nodes:
      children:
        vllm_head:
          hosts:
            node1:
              ansible_host: node1.example.lan   # DNS name or IP
        vllm_worker:
          hosts:
            node2:
              ansible_host: node2.example.lan
      # A single-node setup can list hosts directly instead:
      # hosts:
      #   spark1: {ansible_host: spark1.example.lan}
