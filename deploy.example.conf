# Your host's values for scripts/make-compose.py. Copy to a private place (not this repo), edit, then:
#   scripts/make-compose.py --values deploy.conf --out /mnt/share/sparkvault/docker-compose.yaml          # diff
#   scripts/make-compose.py --values deploy.conf --out /mnt/share/sparkvault/docker-compose.yaml --apply  # write
# Keys left out keep the template's default. One `key = value` per line.

# owner:group (numeric) of the catalogue, inbox and app folders: `ls -ldn <folder>` ON THE SERVER
user = 1000:1000
# Hugging Face cache root, the folder that contains hub/ (an absolute path outside the project folder)
hf_dir = /srv/models/huggingface
# the left side of the port mapping; change only if 8080 is taken
port = 8080
